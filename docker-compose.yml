services:
  cyd-clawd:
    build: ./daemon
    container_name: cyd-clawd
    restart: unless-stopped
    ports:
      - "8765:8765"
    volumes:
      - ${HOME}/.claude:/root/.claude:ro
      - /etc/localtime:/etc/localtime:ro
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Europe/Madrid
