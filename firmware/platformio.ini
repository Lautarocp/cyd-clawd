[env:cyd_2432s028]
platform = espressif32
board = esp32dev
framework = arduino
upload_speed = 921600
monitor_speed = 115200
extra_scripts = pre:pre_build.py

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
    lvgl/lvgl @ 9.2.0
    bblanchon/ArduinoJson @ ^7.0.0

build_flags =
    -DBOARD_CYD_2432S028
    -DLV_CONF_INCLUDE_SIMPLE
    -I ${PROJECT_SRC_DIR}
    ; --- TFT_eSPI: bypass User_Setup.h, define pins aquí ---
    -DUSER_SETUP_LOADED
    -DILI9341_DRIVER
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD
    -DLOAD_FONT2
    -DLOAD_FONT4
    -DSMOOTH_FONT
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000
